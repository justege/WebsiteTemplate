query WhoAmI {
  whoAmI {
    id
    email
    applicationRoleNames 
    firstName
    lastName
    userGuiding {
      hasFinishedAppInstall
      hasActivatedWidget
      hasUsedAIAssistant
      hasCreatedFilter
      hasCreatedLeadScoring
      hasCreatedSegment
      hasCreatedCampaign
    }
  }
}
